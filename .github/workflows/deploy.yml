name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          BRANCH: ${{ github.ref_name }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$SSH_KEY" > key
          ssh -i key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
              "$SSH_USER@$SSH_HOST" "BRANCH=$BRANCH bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/project_management

          DOMAIN=projectsdb.strategizeit.us
          COMPOSE="docker compose -f docker-compose.server.yml"
          PREV=$(git rev-parse --short HEAD)

          echo "==> [1/6] Backup DB"
          mkdir -p ~/backups
          docker exec awqaf-ppm-db pg_dump -U awqaf awqaf_ppm | gzip > ~/backups/pm-$(date +%F-%H%M).sql.gz
          ls -1t ~/backups/pm-*.sql.gz | tail -n +15 | xargs -r rm --

          echo "==> [2/6] Pull $BRANCH"
          git fetch origin
          git reset --hard "origin/$BRANCH"
          NEW=$(git rev-parse --short HEAD)

          echo "==> [3/6] Verify server compose"
          test -f docker-compose.server.yml
          test -f nginx.server.conf
          grep -q VIRTUAL_HOST docker-compose.server.yml
          grep -q awqaf-ppm-api nginx.server.conf

          echo "==> [4/6] Build"
          $COMPOSE build

          echo "==> [5/6] Sync schema + start"
          $COMPOSE up -d postgres
          # -T + closed stdin: compose run must not consume the rest of this SSH script
          $COMPOSE run --rm -T --entrypoint "" api \
            npx prisma migrate deploy </dev/null \
            || $COMPOSE run --rm -T --entrypoint "" api \
                 npx prisma db push --skip-generate </dev/null \
            || echo "WARN: schema sync failed"
          $COMPOSE up -d --force-recreate --remove-orphans

          echo "==> [6/6] Health check"
          for i in $(seq 1 25); do
            if curl -fsS "https://$DOMAIN/api/auth/personas" >/dev/null; then
              echo "OK: $PREV -> $NEW"
              exit 0
            fi
            sleep 3
          done
          echo "FAILED. Previous commit: $PREV"
          $COMPOSE logs --tail 40 api web
          exit 1
          REMOTE
