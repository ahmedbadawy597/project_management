name: Deploy

on:
  push:
    branches: [main]        # غيّرها لو الـ branch الأساسي اسمه تاني
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          BRANCH: ${{ github.ref_name }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$SSH_KEY" > key
          ssh -i key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
              "$SSH_USER@$SSH_HOST" "BRANCH=$BRANCH bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/project_management

          DOMAIN=projectsdb.strategizeit.us
          PREV=$(git rev-parse --short HEAD)

          echo "==> [1/6] Backup DB"
          mkdir -p ~/backups
          docker exec awqaf-ppm-db pg_dump -U awqaf awqaf_ppm | gzip > ~/backups/pm-$(date +%F-%H%M).sql.gz
          ls -1t ~/backups/pm-*.sql.gz | tail -n +15 | xargs -r rm --

          echo "==> [2/6] Pull $BRANCH"
          git fetch origin
          git reset --hard "origin/$BRANCH"
          NEW=$(git rev-parse --short HEAD)

          echo "==> [3/6] Server-specific patches (runtime only)"
          # تخطي type-check لحد ما المبرمج يصلّحه
          sed -i 's/RUN npm run build/RUN npx vite build/' Dockerfile
          # اسم فريد للـ API عشان ما يتلخبطش مع docuvault-api على ecm-net
          sed -i 's|http://api:3001|http://awqaf-ppm-api:3001|' nginx.conf
          # شيل ports المكشوفة + ضيف VIRTUAL_HOST والشبكة الخارجية
          python3 - <<'PY'
          p='docker-compose.yml'
          s=open(p).read()
          s=s.replace("    ports:\n      - '${API_PORT:-3001}:3001'\n","")
          s=s.replace("    ports:\n      - '${WEB_PORT:-80}:80'\n","")
          s=s.replace("""    depends_on:
              - api
            networks:
              - awqaf
          """.replace("\n          ","\n"),"""    depends_on:
              - api
            environment:
              VIRTUAL_HOST: projectsdb.strategizeit.us
              LETSENCRYPT_HOST: projectsdb.strategizeit.us
              VIRTUAL_PORT: 80
            networks:
              - awqaf
              - ecm_ecm-net
          """.replace("\n          ","\n"))
          s=s.replace("networks:\n  awqaf:\n    driver: bridge\n","networks:\n  awqaf:\n    driver: bridge\n  ecm_ecm-net:\n    external: true\n")
          open(p,'w').write(s)
          PY
          grep -q VIRTUAL_HOST docker-compose.yml || { echo "compose patch failed"; exit 1; }

          echo "==> [4/6] Build"
          docker compose build

          echo "==> [5/6] Sync schema + start"
          # مؤقت: لحد ما المبرمج يضيف migration للـ username/email
          docker compose up -d postgres
          docker compose run --rm --entrypoint "" api npx prisma db push --skip-generate \
            || echo "WARN: db push failed"
          docker compose up -d

          echo "==> [6/6] Health check"
          for i in $(seq 1 25); do
            if curl -fsS "https://$DOMAIN/api/auth/personas" >/dev/null; then
              echo "OK: $PREV -> $NEW"
              exit 0
            fi
            sleep 3
          done
          echo "FAILED. Previous commit: $PREV"
          docker compose logs --tail 40 api web
          exit 1
          REMOTE
        
